<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner QR Presensi Siswa - SMAN 1 Bintan Timur</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4f0;color:#222;font-family:Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.10)}
h1{font-size:21px;text-align:center;color:#08783d;margin:4px 0 8px}
p{text-align:center;color:#59645e}
#reader{width:100%;overflow:hidden;border-radius:14px;background:#111;min-height:260px;position:relative}
video{width:100%!important;height:auto!important;display:block;min-height:260px;object-fit:cover}
.scanbox{position:absolute;left:14%;right:14%;top:22%;bottom:22%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:12px;font-weight:bold;font-size:16px;background:#08783d;color:#fff}
button.secondary{background:#555}
.status{margin-top:14px;padding:13px;border-radius:10px;background:#edf7f1;text-align:center;line-height:1.5}
.danger{background:#ffecec;color:#a00000}
.success{background:#e8f8ed;color:#08783d}
.small{font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📷 SCANNER QR PRESENSI</h1>
<p>SMAN 1 Bintan Timur</p>
<div id="reader">
  <video id="video" playsinline autoplay muted></video>
  <div class="scanbox"></div>
</div>
<button id="btnStart">▶ MULAI SCAN</button>
<button id="btnStop" class="secondary" style="display:none">⏹ STOP KAMERA</button>
<div id="status" class="status">Tekan MULAI SCAN, izinkan kamera, lalu arahkan ke QR sekolah.</div>
</div>
</div>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
let stream=null, controls=null, readerObj=null, running=false, busy=false, barcodeTimer=null;

function status(msg, cls){
  const el=document.getElementById('status');
  el.className='status '+(cls||'');
  el.innerHTML=msg;
}
function getReturnUrl(){
  try{
    const u=new URL(location.href);
    return u.searchParams.get('return')||'';
  }catch(e){return '';}
}
function extractToken(raw){
  raw=String(raw||'').trim();
  if(!raw) return '';
  // QR lama: SMANSABT-PRESENSI:TOKEN
  if(raw.indexOf('SMANSABT-PRESENSI:')===0) return raw;
  // Kompatibilitas jika QR berisi URL ?qr=...
  try{
    const u=new URL(raw);
    const q=u.searchParams.get('qr');
    if(q) return q;
  }catch(e){}
  return raw;
}

function sendResult(raw){
  if(busy) return;
  const token=extractToken(raw);
  if(!token){
    status('❌ QR tidak berisi data yang dapat diproses.','danger');
    return;
  }
  busy=true;
  stopCamera(false);
  status('✅ QR TERBACA<br><span class="small">'+escapeHtml(token.substring(0,70))+'</span><br>📍 Meminta izin lokasi...','success');

  const ret=getReturnUrl();
  if(!ret){
    busy=false;
    document.getElementById('btnStart').style.display='block';
    status('❌ URL kembali aplikasi tidak tersedia. Buka scanner dari tombol aplikasi presensi.','danger');
    return;
  }
  if(!navigator.geolocation){
    busy=false;
    document.getElementById('btnStart').style.display='block';
    status('❌ Browser tidak mendukung GPS.','danger');
    return;
  }

  navigator.geolocation.getCurrentPosition(function(pos){
    try{
      const u=new URL(ret, location.href);
      u.searchParams.set('qr',token);
      u.searchParams.set('lat',String(pos.coords.latitude));
      u.searchParams.set('lng',String(pos.coords.longitude));
      if(pos.coords.accuracy) u.searchParams.set('acc',String(pos.coords.accuracy));
      status('✅ QR + lokasi berhasil.<br>Kembali ke aplikasi presensi...','success');
      setTimeout(()=>location.replace(u.toString()),500);
    }catch(e){
      busy=false;
      document.getElementById('btnStart').style.display='block';
      status('❌ URL kembali aplikasi tidak valid.','danger');
    }
  },function(err){
    busy=false;
    document.getElementById('btnStart').style.display='block';
    let m='GPS tidak dapat diperoleh.';
    if(err.code===1)m='Izin lokasi ditolak. Pilih Izinkan untuk situs scanner ini.';
    if(err.code===2)m='Lokasi tidak tersedia. Aktifkan GPS/lokasi HP.';
    if(err.code===3)m='GPS terlalu lama. Coba lagi di tempat terbuka.';
    status('❌ '+m,'danger');
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function startCamera(){
  if(running)return;
  busy=false;
  if(!window.isSecureContext){status('❌ Scanner harus menggunakan HTTPS.','danger');return;}
  if(!navigator.mediaDevices?.getUserMedia){status('❌ Browser tidak mendukung kamera.','danger');return;}

  try{
    status('📷 Meminta izin kamera...','');
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    const video=document.getElementById('video');
    video.srcObject=stream;
    await video.play();
    running=true;
    document.getElementById('btnStart').style.display='none';
    document.getElementById('btnStop').style.display='block';
    status('📷 <b>SCAN AKTIF</b><br>Arahkan kotak putih ke QR sekolah.','');

    // Metode utama: BarcodeDetector bawaan Chrome Android.
    if('BarcodeDetector' in window){
      try{
        const supported=await BarcodeDetector.getSupportedFormats();
        if(supported.includes('qr_code')){
          const detector=new BarcodeDetector({formats:['qr_code']});
          barcodeTimer=setInterval(async()=>{
            if(!running||busy||video.readyState<2)return;
            try{
              const codes=await detector.detect(video);
              if(codes&&codes.length&&codes[0].rawValue)sendResult(codes[0].rawValue);
            }catch(e){}
          },250);
          return;
        }
      }catch(e){}
    }

    // Fallback: ZXing jika BarcodeDetector tidak tersedia.
    if(typeof ZXingBrowser==='undefined'){
      status('⚠️ Kamera aktif, tetapi mesin pembaca QR belum termuat. Pastikan internet aktif.','danger');
      return;
    }
    readerObj=new ZXingBrowser.BrowserMultiFormatReader();
    controls=await readerObj.decodeFromVideoDevice(
      undefined,
      video,
      (result,error)=>{
        if(result && result.getText) sendResult(result.getText());
      }
    );
  }catch(err){
    stopCamera(false);
    let msg='Kamera tidak dapat digunakan.';
    if(err?.name==='NotAllowedError')msg='Izin kamera ditolak. Izinkan kamera untuk situs scanner ini.';
    else if(err?.name==='NotFoundError')msg='Kamera tidak ditemukan.';
    else if(err?.name==='NotReadableError')msg='Kamera sedang dipakai aplikasi lain.';
    else if(err?.message)msg=err.message;
    status('❌ '+msg,'danger');
  }
}
function stopCamera(show=true){
  running=false;
  if(barcodeTimer){clearInterval(barcodeTimer);barcodeTimer=null}
  try{controls?.stop?.()}catch(e){}
  controls=null;
  try{readerObj?.reset?.()}catch(e){}
  readerObj=null;
  try{stream?.getTracks()?.forEach(t=>t.stop())}catch(e){}
  stream=null;
  const video=document.getElementById('video');
  if(video)video.srcObject=null;
  document.getElementById('btnStart').style.display='block';
  document.getElementById('btnStop').style.display='none';
  if(show)status('Scanner dihentikan. Tekan MULAI SCAN untuk mencoba lagi.');
}
document.getElementById('btnStart').onclick=startCamera;
document.getElementById('btnStop').onclick=()=>stopCamera(true);
window.addEventListener('pagehide',()=>stopCamera(false));
</script>
</body>
</html>
