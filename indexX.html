<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner QR Presensi Siswa</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4f0;color:#222;font-family:Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.10)}
h1{font-size:21px;text-align:center;color:#08783d;margin:4px 0 8px}
p{text-align:center;color:#59645e}
#reader{width:100%;overflow:hidden;border-radius:14px;background:#111;position:relative}
#video{width:100%;display:block;min-height:260px;object-fit:cover}
.scanbox{position:absolute;left:14%;right:14%;top:22%;bottom:22%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:12px;font-weight:bold;font-size:16px;background:#08783d;color:#fff}
button.secondary{background:#555}
.status{margin-top:14px;padding:13px;border-radius:10px;background:#edf7f1;text-align:center;line-height:1.5}
.danger{background:#ffecec;color:#a00000}
.success{background:#e8f8ed;color:#08783d}
.small{font-size:12px}
#canvas{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📷 SCANNER QR PRESENSI</h1>
<p>SMAN 1 Bintan Timur</p>

<div id="reader">
  <video id="video" playsinline autoplay muted></video>
  <div class="scanbox"></div>
</div>
<canvas id="canvas"></canvas>

<button id="btnStart">▶ MULAI SCAN</button>
<button id="btnStop" class="secondary" style="display:none">⏹ STOP KAMERA</button>
<div id="status" class="status">
  Tekan MULAI SCAN, izinkan kamera, lalu arahkan kotak putih ke QR sekolah.
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
let stream=null;
let timer=null;
let running=false;
let busy=false;

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});

function setStatus(msg, cls){
  const el=document.getElementById('status');
  el.className='status '+(cls||'');
  el.innerHTML=msg;
}

function extractToken(raw){
  raw=String(raw||'').trim();
  if(raw.startsWith('SMANSABT-PRESENSI:')) return raw;

  try{
    const u=new URL(raw);
    const q=u.searchParams.get('qr');
    if(q && q.startsWith('SMANSABT-PRESENSI:')) return q;
  }catch(e){}

  return '';
}

function stopCamera(){
  running=false;
  if(timer){clearInterval(timer);timer=null}
  if(stream){
    stream.getTracks().forEach(function(t){
      try{t.stop()}catch(e){}
    });
    stream=null;
  }
  video.srcObject=null;
  document.getElementById('btnStart').style.display='block';
  document.getElementById('btnStop').style.display='none';
}

function sendResult(qr){
  if(busy)return;

  const token=extractToken(qr);
  if(!token){
    setStatus(
      '❌ QR terbaca, tetapi isinya bukan token presensi sekolah.<br>' +
      '<span class="small">QR harus diawali SMANSABT-PRESENSI:</span>',
      'danger'
    );
    return;
  }

  busy=true;
  stopCamera();

  setStatus(
    '✅ <b>QR TERBACA</b><br>' +
    '<span class="small">'+escapeHtml(token)+'</span><br>' +
    '📍 Meminta izin lokasi...',
    'success'
  );

  if(!navigator.geolocation){
    busy=false;
    setStatus('❌ Browser tidak mendukung GPS.','danger');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos){
      const lat=pos.coords.latitude;
      const lng=pos.coords.longitude;

      if(window.opener && !window.opener.closed){
        window.opener.postMessage({
          type:'SMANSA_QR_PRESENSI_RESULT',
          qr:token,
          lat:lat,
          lng:lng,
          accuracy:pos.coords.accuracy || 0
        }, '*');

        setStatus(
          '✅ <b>QR + LOKASI BERHASIL</b><br>' +
          'Mengirim hasil ke aplikasi presensi...<br>' +
          '<span class="small">Jangan tutup aplikasi presensi.</span>',
          'success'
        );

        setTimeout(function(){
          try{window.close()}catch(e){}
        },700);
      }else{
        busy=false;
        setStatus(
          '❌ Scanner tidak terhubung ke aplikasi presensi.<br>' +
          'Tutup scanner ini dan tekan BUKA SCANNER QR dari aplikasi siswa.',
          'danger'
        );
      }
    },
    function(err){
      busy=false;
      let msg='GPS tidak dapat diperoleh.';
      if(err.code===1)msg='Izin lokasi ditolak. Pilih Izinkan untuk situs scanner ini.';
      else if(err.code===2)msg='Lokasi tidak tersedia. Aktifkan Lokasi/GPS HP.';
      else if(err.code===3)msg='Pengambilan lokasi terlalu lama. Coba lagi.';
      setStatus('❌ '+msg,'danger');
      document.getElementById('btnStart').style.display='block';
    },
    {enableHighAccuracy:true,timeout:20000,maximumAge:0}
  );
}

function scanFrame(){
  if(!running || busy || video.readyState<2 || !video.videoWidth)return;

  const w=video.videoWidth;
  const h=video.videoHeight;

  canvas.width=w;
  canvas.height=h;
  ctx.drawImage(video,0,0,w,h);

  const image=ctx.getImageData(0,0,w,h);

  if(typeof jsQR!=='function'){
    setStatus(
      '⚠️ Kamera aktif, tetapi mesin pembaca QR belum termuat. Pastikan internet aktif.',
      'danger'
    );
    return;
  }

  const code=jsQR(image.data,image.width,image.height,{
    inversionAttempts:'attemptBoth'
  });

  if(code && code.data){
    sendResult(code.data);
  }
}

async function startCamera(){
  if(running)return;

  if(!window.isSecureContext){
    setStatus('❌ Scanner harus dibuka melalui HTTPS.','danger');
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('❌ Browser tidak mendukung akses kamera. Gunakan Chrome Android terbaru.','danger');
    return;
  }

  try{
    setStatus('📷 Meminta izin kamera...');

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    running=true;
    busy=false;
    document.getElementById('btnStart').style.display='none';
    document.getElementById('btnStop').style.display='block';

    setStatus(
      '📷 <b>SCAN AKTIF</b><br>Arahkan kotak putih tepat ke QR sekolah.'
    );

    timer=setInterval(scanFrame,180);
  }catch(err){
    stopCamera();

    let msg='Kamera tidak dapat digunakan.';
    if(err && err.name==='NotAllowedError')
      msg='Izin kamera ditolak. Izinkan kamera untuk situs scanner ini.';
    else if(err && err.name==='NotFoundError')
      msg='Kamera tidak ditemukan.';
    else if(err && err.name==='NotReadableError')
      msg='Kamera sedang digunakan aplikasi lain.';
    else if(err && err.message)
      msg=err.message;

    setStatus('❌ '+msg,'danger');
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

document.getElementById('btnStart').addEventListener('click',startCamera);
document.getElementById('btnStop').addEventListener('click',function(){
  stopCamera();
  busy=false;
  setStatus('Scanner dihentikan. Tekan MULAI SCAN untuk mencoba lagi.');
});

window.addEventListener('pagehide',stopCamera);
</script>
</body>
</html>
